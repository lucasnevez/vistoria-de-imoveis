<style>
/* Layout: uma coluna de campo (celular primeiro), barra fixa no topo, fases em sequência. As cores da marca vêm das Configurações de cada imobiliária (aplicarTema). */
:root {
  color-scheme: dark;
  --ink: #07090C;
  --deep: #111821;
  --panel: rgba(18, 25, 34, 0.88);

  --stroke: #DCE3EA;
  --accent: #4C9AFF;
  --accent-ink: #06111F;
  --capa: #14202B;
  --ok: #6FD39B;
  --warn: #E9AB2B;
  --bad: #E67D58;
  --grad: radial-gradient(130% 90% at 20% 0%, #1C2A38 0%, #121A24 40%, #0B1016 75%, #07090C 100%);
  --font: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r: 3px;
  --fs-xs: 0.75rem;
  --fs-s: 0.875rem;
  --fs-m: 1rem;
  --fs-l: 1.25rem;
  --fs-xl: 1.625rem;
}
html { background: var(--ink); }
body {
  min-height: 100vh;
  background: var(--grad) no-repeat fixed, var(--ink);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--deep); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(11, 16, 22, 0.94); border-bottom: 1px solid var(--line); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.top-in { max-width: 760px; margin: 0 auto; min-height: 56px; display: flex; align-items: center; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-stretch: 112%; letter-spacing: 0.01em; font-size: var(--fs-m); min-width: 0; }
.brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.save { margin-left: auto; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; }

.icon-btn:hover { border-color: var(--line-2); }
.top-in .icon-btn:last-child { margin-left: 0; }

.kicker { display: flex; align-items: center; gap: 10px; margin: 0; font-size: var(--fs-xs); font-weight: 700; font-stretch: 115%; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }

p { margin: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 16px; border-radius: var(--r); border: 1px solid var(--line-2); background: transparent; color: var(--fg); font-weight: 700; font-size: 0.95rem; cursor: pointer; text-decoration: none; text-align: center; }

.phases li::before { content: counter(f, decimal-leading-zero); grid-row: span 2; color: var(--accent); font-weight: 800; font-variant-numeric: tabular-nums; font-size: var(--fs-s); padding-top: 2px; }

.msg { padding: 12px 14px; border-left: 3px solid var(--muted); background: rgba(3, 9, 7, 0.45); font-size: var(--fs-s); color: var(--stroke); display: flex; flex-direction: column; gap: 8px; }

.th { position: relative; margin: 0; aspect-ratio: 1; max-width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }

.th .x { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; display: grid; place-items: center; background: rgba(3, 9, 7, 0.82); border: 1px solid var(--line-2); border-radius: var(--r); cursor: pointer; color: var(--fg); }

.spin { width: 18px; height: 18px; border: 2px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%; animation: gira 0.9s linear infinite; flex: none; }

.passos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }

.changes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.changes li { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-s); }

<script>
(() => {
'use strict';

/* ---------- utilidades ---------- */
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const clone = (o) => JSON.parse(JSON.stringify(o));
const pad = (n) => String(n).padStart(2, '0');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function uid() {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (_) {}
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);

async function aoEscolherFotos(files) {
  const v = S.v;
  if (!v || S.busy) return;
  const n = v.loteAtual.n;
  const pend = v.fotos.filter((f) => f.lote === n && f.pendente).length;
  const vaga = MAX_FOTOS - pend - S.subindo;
  const lista = [...files].filter((f) => /^image\//.test(f.type) || /\.(jpe?g|png|heic|heif|webp)$/i.test(f.name)).slice(0, Math.max(0, vaga));

  for (const file of lista) {
    const tmp = { id: 'tmp' + uid(), url: URL.createObjectURL(file) };
    S.carregando.push(tmp); S.subindo++; desenharFotos();
    try {
      const r = await reduzir(file, 1600, 0.8);
      let id;
      if (S.assets) { const up = await S.assets.upload(r.blob, { type: 'image/jpeg' }); id = up.id; }
      else id = 'local-' + uid();

/* ---------- revisor do laudo ---------- */
function checagens(v) {
  const p = [];
  if (!String(v.locador || '').trim()) p.push('Falta o nome do locador (proprietário). Preencha na fase Dados, em "Dados que vão no laudo".');
  if (!String(v.locatario || '').trim()) p.push('Falta o nome do locatário (inquilino). Preencha na fase Dados.');
  if (!String(v.vistoriador || '').trim()) p.push('Falta o nome do vistoriador. Preencha na fase Dados.');
  if (!v.comodos.length) p.push('O relatório não tem nenhum cômodo.');
  v.comodos.forEach((c) => {
    if (!c.itens.length) p.push(`O cômodo "${c.nome}" está sem itens.`);
    c.itens.forEach((i) => {
      if (!i.estado) p.push(`${c.nome}, ${i.nome}: está sem estado.`);
      if (String(i.descricao || '').trim().length < 12) p.push(`${c.nome}, ${i.nome}: a descrição está curta demais para um laudo.`);
    });
  });
  if (v.tipo === 'saida' && entradaDe(v) && (!v.comparacao || v.comparacao.desatualizada)) p.push('A comparação com a vistoria de entrada está faltando ou desatualizada. Use "Comparar de novo".');
  if (!String(v.parecer || '').trim()) p.push('As considerações finais estão vazias.');
  if (v.fotos.some((f) => f.pendente)) p.push('Há fotos de um lote que ainda não foi processado.');
  return p;
}
async function revisorClaude(v, signal) {
  const linhas = cabecalhoPrompt(v);
  linhas.push('',
    'Você é o revisor de padronização dos laudos desta imobiliária. Revise o relatório abaixo antes de ele virar PDF e aponte só o que precisa mudar.',
    'Regras do padrão:',
    '1. Nomes de cômodos no padrão: Sala, Cozinha, Quarto 1, Quarto 2, Banheiro social, Banheiro da suíte, Área de serviço, Varanda, Garagem, Área externa, Medidores e chaves. A mesma coisa não pode aparecer com dois nomes.',
    '2. Nomes de itens iguais em todos os cômodos: Piso, Paredes, Teto, Portas, Janelas, Tomadas e interruptores, Iluminação, Bancada, Pia, Torneira, Armários, Box, Vaso sanitário, Chuveiro, e assim por diante.',
    '3. O estado precisa combinar com a descrição. Descrição com vazamento, trinca, infiltração, mofo ou quebra não pode estar como "bom" ou "novo".',
    '4. Português formal de laudo: terceira pessoa, frases objetivas, ortografia correta, sem gírias, sem primeira pessoa, sem opinião, preço ou promessa. Tire expressões como "conforme relato do vistoriador", "segundo o vistoriador" e "não informado".',
    '5. "critico" deve ser true quando houver dano, vazamento, infiltração, mofo, quebra ou item faltando, e false nos outros casos.',
    'Não invente informação. Se a descrição for curta, não complete com detalhes inventados: deixe como está.',
    '', 'Relatório (JSON):', relatorioJSON(v.comodos, false),
    '', 'Responda apenas com JSON neste formato:',
    '{"resumo":"Uma ou duas frases sobre o laudo.","correcoes":[{"comodo":"Cozinha","item":"Torneira da pia","campo":"estado","valorNovo":"ruim","motivo":"A descrição fala em vazamento."}]}',
    'Valores de "campo": "nome" (renomear o item), "estado", "descricao", "critico" ("true" ou "false") ou "comodo" (renomear o cômodo, com "item" vazio). Valores de estado: "novo", "bom", "regular", "ruim" ou "nao_se_aplica". Use uma lista vazia quando estiver tudo no padrão.');
  const r = await S.sample.json(linhas.join('\n'), { signal, modelTier: 'default' });
  if (!r || typeof r !== 'object' || !Array.isArray(r.correcoes)) throw { code: 'invalid_json' };
  const campos = new Set(['nome', 'estado', 'descricao', 'critico', 'comodo']);
  const correcoes = r.correcoes
    .filter((x) => x && campos.has(x.campo) && String(x.valorNovo ?? '').trim() !== '')
    .slice(0, 40)
    .map((x) => {
      const c = v.comodos.find((cc) => norm(cc.nome) === norm(x.comodo));
      const it = c && x.item ? c.itens.find((ii) => norm(ii.nome) === norm(x.item)) : null;
      let atual = '';
      if (x.campo === 'comodo') atual = c ? c.nome : '';
      else if (it) atual = x.campo === 'estado' ? estadoLabel(it.estado) : x.campo === 'critico' ? (it.critico ? 'sim' : 'não') : String(it[x.campo] || '');
      return { comodo: String(x.comodo || ''), item: String(x.item || ''), campo: x.campo, valorNovo: String(x.valorNovo).trim(), motivo: String(x.motivo || ''), atual, valida: x.campo === 'comodo' ? !!c : !!it };
    })
    .filter((x) => x.valida && !(x.campo === 'estado' && !ESTADO_OK.has(x.valorNovo)));
  return { resumo: String(r.resumo || '').trim(), correcoes };
}
async function revisarLaudo() {
  const v = S.v;
  if (!v || S.busy) return;
  await flush();
  S.aba = 'revisao'; S.revisao = null;
  const pontos = checagens(v);
  let rev = { resumo: '', correcoes: [] }, erro = '';
  if (S.sample) {
    const ctl = new AbortController();
    S.busy = { vid: v.id, titulo: 'Revisando o laudo antes do PDF', ctl, podeParar: true, passos: [{ k: 'rev', txt: 'Revisor conferindo a padronização do laudo', st: 'run', det: 'costuma levar menos de um minuto' }] };
    render();
    try { rev = await revisorClaude(v, ctl.signal); }
    catch (e) { if (e.code === 'cancelled') { S.busy = null; render(); return; } erro = erroClaude(e); }
    S.busy = null;
  }
  if (!pontos.length && !rev.correcoes.length && !erro) { toast('O revisor não encontrou nada fora do padrão.'); return finalizar(); }
  S.revisao = { vid: v.id, pontos, resumo: rev.resumo, correcoes: rev.correcoes, marcadas: rev.correcoes.map(() => true), erro };
  render();
  const el = document.getElementById('painel-revisao');
  if (el) el.scrollIntoView({ block: 'start' });
}
function aplicarRevisao(aplicar) {
  const v = S.v, r = S.revisao;
  if (!v || !r || r.vid !== v.id) return;
  if (aplicar) {
    const ordem = r.correcoes.map((x, n) => ({ x, n })).filter((o) => r.marcadas[o.n]);
    for (const { x } of ordem.filter((o) => o.x.campo !== 'comodo')) {
      const c = v.comodos.find((cc) => norm(cc.nome) === norm(x.comodo));
      const it = c && c.itens.find((ii) => norm(ii.nome) === norm(x.item));
      if (!it) continue;
      if (x.campo === 'estado') it.estado = x.valorNovo;
      else if (x.campo === 'critico') it.critico = /^(true|sim|1)$/i.test(x.valorNovo);
      else it[x.campo] = x.valorNovo;
    }
    for (const { x } of ordem.filter((o) => o.x.campo === 'comodo')) {
      const c = v.comodos.find((cc) => norm(cc.nome) === norm(x.comodo));
      if (c) c.nome = x.valorNovo;
    }
    markDirty();
  }
  S.revisao = null;
  return finalizar();
}

/* Prepara a logo: tira o fundo claro e uniforme (comum em JPG), recorta as sobras e mede se a arte é clara ou escura. */
async function prepararLogo(blob) {
  const cv = await logoCanvas(blob, 1200);
  const W = cv.width, H = cv.height;
  const ctx = cv.getContext('2d');
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  const borda = [];
  for (let x = 0; x < W; x++) { borda.push(x, (H - 1) * W + x); }
  for (let y = 0; y < H; y++) { borda.push(y * W, y * W + W - 1); }
  const opacos = borda.filter((q) => d[q * 4 + 3] > 240);
  let fundoClaro = false, removido = false;
  if (opacos.length > borda.length * 0.9) {
    let r = 0, g = 0, b = 0;
    for (const q of opacos) { r += d[q * 4]; g += d[q * 4 + 1]; b += d[q * 4 + 2]; }
    r /= opacos.length; g /= opacos.length; b /= opacos.length;
    const parecidos = opacos.filter((q) => Math.hypot(d[q * 4] - r, d[q * 4 + 1] - g, d[q * 4 + 2] - b) < 36).length;
    if (parecidos > opacos.length * 0.85 && lum([r, g, b]) > 0.72) {
      fundoClaro = true;
      const vis = new Uint8Array(W * H), fila = new Int32Array(W * H);
      let ini = 0, fim = 0;
      for (const q of borda) if (!vis[q]) { vis[q] = 1; fila[fim++] = q; }
      while (ini < fim) {
        const q = fila[ini++], k = q * 4;
        const dist = Math.hypot(d[k] - r, d[k + 1] - g, d[k + 2] - b);
        if (d[k + 3] < 10 || dist < 60) {
          d[k + 3] = dist < 38 ? 0 : Math.min(d[k + 3], Math.round(((dist - 38) / 22) * 255));
          const x = q % W, y = (q - x) / W;
          if (x > 0 && !vis[q - 1]) { vis[q - 1] = 1; fila[fim++] = q - 1; }
          if (x < W - 1 && !vis[q + 1]) { vis[q + 1] = 1; fila[fim++] = q + 1; }
          if (y > 0 && !vis[q - W]) { vis[q - W] = 1; fila[fim++] = q - W; }
          if (y < H - 1 && !vis[q + W]) { vis[q + W] = 1; fila[fim++] = q + W; }
        }
      }
      removido = true;
    }
  }
  let minX = W, minY = H, maxX = -1, maxY = -1, soma = 0, n = 0;
  for (let q = 0; q < W * H; q++) {
    const k = q * 4;
    if (d[k + 3] > 16) { const x = q % W, y = (q - x) / W; if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }

  }

  const tom = tomLum < 0.3 ? 'escura' : tomLum > 0.6 ? 'clara' : 'media';
  let limpa = null;
  if (removido && maxX > minX && maxY > minY) {
    ctx.putImageData(img, 0, 0);
    const pad = Math.round(Math.max(maxX - minX, maxY - minY) * 0.03);
    const x0 = Math.max(0, minX - pad), y0 = Math.max(0, minY - pad);
    const x1 = Math.min(W, maxX + pad + 1), y1 = Math.min(H, maxY + pad + 1);
    const cv2 = document.createElement('canvas'); cv2.width = x1 - x0; cv2.height = y1 - y0;
    cv2.getContext('2d').drawImage(cv, x0, y0, x1 - x0, y1 - y0, 0, 0, x1 - x0, y1 - y0);
    limpa = await new Promise((res) => cv2.toBlob(res, 'image/png'));

}
async function trocarLogo(file) {

/* ---------- cores sugeridas pela logo ---------- */
async function sugerirCores(blob) {
  const cv = await logoCanvas(blob, 64);
  const { data } = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height);
  const baldes = new Map();
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 200) continue;
    const r = data[i], g = data[i + 1], b = data[i + 2];
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const k = `${r >> 4},${g >> 4},${b >> 4}`;
    const o = baldes.get(k) || { n: 0, r: 0, g: 0, b: 0, sat: 0 };
    o.n++; o.r += r; o.g += g; o.b += b; o.sat += max ? (max - min) / max : 0;
    baldes.set(k, o);
  }
  const cores = [...baldes.values()].map((o) => ({ rgb: [o.r / o.n, o.g / o.n, o.b / o.n].map(Math.round), n: o.n, sat: o.sat / o.n }));
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  const vivas = cores.filter((c) => c.sat > 0.35 && lum(c.rgb) > 0.03 && lum(c.rgb) < 0.85).sort((a, b) => b.n * (0.5 + b.sat) - a.n * (0.5 + a.sat));
  const escolhidas = [];
  for (const c of vivas) { if (escolhidas.every((e) => dist(e.rgb, c.rgb) > 60)) escolhidas.push(c); if (escolhidas.length >= 2) break; }
  const escura = cores.filter((c) => lum(c.rgb) < 0.06 && c.n > 4).sort((a, b) => b.n - a.n)[0];
  const capaDe = (rgb) => (escura ? hexDe(escura.rgb) : hexDe(misturar(rgb, [0, 0, 0], 0.72)));
  const combos = escolhidas.map((c) => ({ principal: hexDe(c.rgb), capa: capaDe(c.rgb) }));
  if (!combos.length) combos.push({ principal: CFG_PADRAO.corPrincipal, capa: escura ? hexDe(escura.rgb) : CFG_PADRAO.corCapa });
  if (combos.every((c) => c.capa.toLowerCase() !== '#14202b')) combos.push({ principal: combos[0].principal, capa: '#14202B' });
  return combos.slice(0, 3);
}

/* ---------- logo ---------- */
async function logoCanvas(blob, max) {
  const im = await abrirImagem(blob);
  const w0 = im.w || 600, h0 = im.h || 300;
  const k = Math.min(1, max / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(im.el, 0, 0, w, h); im.fim();
  return cv;
}
async function logoPNG(blob) {
  const cv = await logoCanvas(blob, 900);

}

/* ---------- PDF ---------- */
function pdfTexto(s) {
  return String(s ?? '')
    .replace(/[‘’‚′]/g, "'").replace(/[“”„″]/g, '"')
    .replace(/[–—−]/g, '-').replace(/…/g, '...').replace(/[•●▪‣]/g, '-')
    .replace(/[   ]/g, ' ').replace(/→/g, '>').replace(/×/g, 'x')
    .replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g, '');
}
async function gerarPDF(v, progresso, pronto) {
  const { jsPDF } = window.jspdf;
  const cfg = S.cfg;
  const doc = new jsPDF({ unit: 'mm', format: 'a4', compress: true });
  const W = 210, H = 297, M = 16, CW = W - 2 * M, BASE = H - 18;
  const corP = corCfg('corPrincipal'), corC = corCfg('corCapa');
  const capaClara = lum(rgbDe(corC)) > 0.45;
  const tituloCapa = rgbDe(tintaSobre(corC));
  const C = {
    capa: rgbDe(corC), acento: rgbDe(corParaFundoClaro(corP)),
    acentoCapa: rgbDe(capaClara ? corParaFundoClaro(corP) : corParaFundoEscuro(corP)),
    tituloCapa, subCapa: misturar(tituloCapa, rgbDe(corC), 0.35),
    tinta: [22, 30, 38], cinza: [96, 106, 117], linha: [218, 224, 230], fundo: [242, 245, 248],
  };
  const estilo = estiloCapa(), kc = capaCores(estilo);
  C.capa = rgbDe(kc.fundo); C.acentoCapa = rgbDe(kc.ac); C.tituloCapa = rgbDe(kc.tit); C.subCapa = rgbDe(kc.sub);
  const COR_EST = { novo: [19, 128, 86], bom: [19, 128, 86], regular: [176, 112, 18], ruim: [190, 72, 40], nao_se_aplica: [120, 132, 125], '': [120, 132, 125] };
  const T = pdfTexto;
  const tipoNome = v.tipo === 'saida' ? 'saída' : 'entrada';
  const lh = (size, f) => size * 0.3528 * (f || 1.38);

  function cabecalhoInterno() {
    doc.setDrawColor(...C.acento); doc.setLineWidth(0.5); doc.line(M, 12, M + 8, 12);
    fonte('bold', 7.5, C.cinza);
    doc.text(T(`LAUDO DE VISTORIA DE ${tipoNome.toUpperCase()}`), M + 11, 12.9, { charSpace: 0.3 });
    fonte('normal', 7.5, C.cinza);

    y += o.depois === undefined ? 1.5 : o.depois;

    y += 5;

    y += 7;

  const endL = doc.splitTextToSize(T(v.endereco), CW - (logo ? 58 : 10)).slice(0, 2);

      espaco(12);
      fonte('bold', 9.5, C.tinta);
      const tit = T(`${c.nome}, ${i.nome}`);
      doc.text(tit, M, y + 3.4);
      fonte('bold', 8, COR_EST[i.estado] || COR_EST['']);
      rotuloDireita(T(estadoLabel(i.estado).toUpperCase()), y + 3.4);
      y += lh(9.5);
      if (i.descricao) paragrafo(i.descricao, { tam: 9, cor: C.cinza, depois: 2 });
      else y += 2;
    }
  }

  if (v.tipo === 'saida' && v.comparacao && v.comparacao.itens && v.comparacao.itens.length) {
    secao('Comparativo com a vistoria de entrada', e ? `Entrada de ${dataCurta(e.data)}` : 'Comparativo');
    if (v.comparacao.resumo) paragrafo(v.comparacao.resumo, { tam: 9.5, depois: 3 });
    const ordem = ['dano', 'faltando', 'desgaste_natural', 'avaliar', 'novo'];
    const comMudanca = v.comparacao.itens.filter((x) => x.situacao !== 'sem_alteracao').sort((a, b) => ordem.indexOf(a.situacao) - ordem.indexOf(b.situacao));
    for (const x of comMudanca) {
      espaco(16);
      fonte('bold', 9.5, C.tinta); doc.text(T(`${x.comodo}, ${x.item}`), M, y + 3.4);
      const corSit = ['dano', 'faltando'].includes(x.situacao) ? COR_EST.ruim : ['desgaste_natural', 'avaliar'].includes(x.situacao) ? COR_EST.regular : COR_EST.bom;
      fonte('bold', 8, corSit); rotuloDireita(T(sitLabel(x.situacao).toUpperCase()), y + 3.4);
      y += lh(9.5);
      fonte('normal', 8.5, C.cinza);
      doc.text(T(`Entrada: ${x.entrada ? estadoLabel(x.entrada) : 'não registrado'}   |   Saída: ${x.saida ? estadoLabel(x.saida) : 'não registrado'}`), M, y + 3);
      y += lh(8.5) + 0.5;
      if (x.explicacao) paragrafo(x.explicacao, { tam: 9, depois: 0.5 });
      if (x.sugestao) paragrafo('Sugestão: ' + x.sugestao, { tam: 8.5, estilo: 'italic', cor: C.cinza, depois: 2.5 });
      else y += 2;
    }
    const iguais = v.comparacao.itens.filter((x) => x.situacao === 'sem_alteracao');
    if (iguais.length) paragrafo('Sem alteração em relação à entrada: ' + iguais.map((x) => `${x.comodo}, ${x.item}`).join('; ') + '.', { tam: 8.5, cor: C.cinza, depois: 2 });
  }

  for (const c of v.comodos) {
    secao(c.nome, 'Cômodo');
    for (const i of c.itens) {
      fonte('normal', 9.5);
      const dl = i.descricao ? doc.splitTextToSize(T(i.descricao), CW).length : 0;
      espaco(Math.min(60, lh(10) + dl * lh(9.5) + 9));
      const cor = COR_EST[i.estado] || COR_EST[''];
      doc.setFillColor(...cor); doc.rect(M, y + 1, 1.1, 3.6, 'F');
      fonte('bold', 10, C.tinta);
      doc.text(doc.splitTextToSize(T(i.nome), CW - 45)[0] || '', M + 3.5, y + 4);
      fonte('bold', 8, cor);
      rotuloDireita(T((i.critico ? 'Atenção  |  ' : '') + estadoLabel(i.estado)).toUpperCase(), y + 4);
      y += lh(10) + 1;
      if (i.descricao) paragrafo(i.descricao, { tam: 9.5, depois: 0.5 });
      if (i.fotos.length) { fonte('normal', 8, C.cinza); espaco(5); doc.text(T('Fotos: ' + i.fotos.join(', ')), M, y + 3); y += 4.5; }
      y += 1.5;
      doc.setDrawColor(...C.linha); doc.setLineWidth(0.2); doc.line(M, y, W - M, y);
      y += 2.5;
    }
    if (c.observacoes) paragrafo('Observações: ' + c.observacoes, { tam: 9, estilo: 'italic', cor: C.cinza, depois: 3 });
    const codes = [];
    c.itens.forEach((i) => i.fotos.forEach((f) => { if (!codes.includes(f)) codes.push(f); }));
    if (codes.length) { y += 2; grade(codes); }
  }

  if ((v.fotosSoltas || []).length) { secao('Outras fotos da vistoria', 'Fotos'); grade(v.fotosSoltas); }
  if (String(v.observacoesGerais || '').trim()) { secao('Observações gerais'); paragrafo(v.observacoesGerais, { tam: 10 }); }
  if (String(v.parecer || '').trim()) { secao('Considerações finais'); paragrafo(v.parecer, { tam: 10 }); }

  const declaracao = v.tipo === 'saida' ? cfg.declaracaoSaida : cfg.declaracaoEntrada;
  fonte('normal', 9.5);
  const blocoAssinaturas = 25 + doc.splitTextToSize(T(declaracao), CW).length * lh(9.5) + 3 + lh(9.5) + 2 + 60;
  if (blocoAssinaturas < BASE - 22) espaco(blocoAssinaturas);
  secao('Declaração e assinaturas');
  paragrafo(declaracao, { tam: 9.5, depois: 3 });
  paragrafo(`${String(cfg.cidade || '').trim() ? cfg.cidade + ', ' : ''}${dataLonga(v.data)}.`, { tam: 9.5, depois: 2 });
  espaco(58);
  y += 16;
  const colW = (CW - 14) / 2;
  function assinatura(x, yy, papel, nome) {
    doc.setDrawColor(...C.tinta); doc.setLineWidth(0.3); doc.line(x, yy, x + colW, yy);
    fonte('bold', 9, C.tinta); doc.text(T(nome || ' '), x, yy + 4.6);
    fonte('normal', 8, C.cinza); doc.text(T(papel), x, yy + (nome ? 8.8 : 4.6));
  }
  assinatura(M, y, 'Locador', v.locador);
  assinatura(M + colW + 14, y, 'Locatário', v.locatario);
  y += 24;
  assinatura(M, y, String(cfg.empresa || '').trim() ? `Vistoriador, ${cfg.empresa}` : 'Vistoriador', v.vistoriador);
  y += 12;

  const total = doc.getNumberOfPages();
  for (let p = 1; p <= total; p++) {
    doc.setPage(p);
    doc.setDrawColor(...C.linha); doc.setLineWidth(0.2); doc.line(M, H - 12.5, W - M, H - 12.5);
    fonte('normal', 7.5, C.cinza);
    const rod = [cfg.empresa, creciFmt(cfg.creci), cfg.contato].filter((s) => String(s || '').trim()).join('  |  ');
    doc.text(T(rod), M, H - 8.5);
    doc.text(`Página ${p} de ${total}`, W - M, H - 8.5, { align: 'right' });
  }
  return doc.output('blob');
}

function setMsg(onde, texto, tom, fixa) {

  if (el) el.innerHTML = viewMsg(onde);
  else render();
}
function viewMsg(onde) {
  if (!S.msg || S.msg.onde !== onde) return '';
  return `<div class="msg ${esc(S.msg.tom)}" role="status"><p>${esc(S.msg.texto)}</p></div>`;
}
let toastTimer = null;
function toast(texto, acao, act) {
  const root = document.getElementById('toast-root');
  if (!root) return;
  root.innerHTML = `<div class="toast" role="status"><span class="grow">${esc(texto)}</span>${acao ? `<button class="btn sm" data-act="${esc(act)}">${esc(acao)}</button>` : ''}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, acao ? 9000 : 4500);
}

        ? `<p class="hint">Todas as vistorias, de todos da equipe, vão para a pasta "${esc(nomeRaiz())}". Você pode mover essa pasta para onde quiser no Drive; o app continua achando.</p><div><a class="btn sm" href="${esc(pastaUrl)}" target="_blank" rel="noopener">Abrir a pasta das vistorias</a></div>`
        : `<p class="muted">${dono ? 'A pasta ainda não existe. Crie agora para poder compartilhar com a equipe.' : 'O dono do app ainda não criou a pasta das vistorias.'}</p>`}
      ${dono ? `<div><button class="btn primary sm" data-act="cfg-pasta" ${S.cfgOcupado ? 'disabled' : ''}>${pastaUrl ? 'Conferir se a pasta está acessível' : 'Criar a pasta agora'}</button></div>
        <div class="field"><label for="c-pasta">Usar outra pasta do Drive (cole o link da pasta)</label><input id="c-pasta" data-novapasta value="${esc(S.novaPasta)}" placeholder="https://drive.google.com/drive/folders/..." autocomplete="off"></div>
        <div><button class="btn sm" data-act="cfg-trocar" ${S.cfgOcupado ? 'disabled' : ''}>Usar esta pasta</button></div>` : '<p class="hint">Só o dono do app cria ou troca a pasta.</p>'}
      ${S.cfgOcupado ? '<div class="loading-line"><span class="spin"></span>Falando com o Google Drive</div>' : ''}
      ${S.cfgAviso ? aviso(S.cfgAviso, 'bad') : ''}
    </section>
    <section class="card">
      <h3>Como dar acesso a um colega</h3>
      <ol class="phases">
        <li><b>Compartilhe a pasta no Drive</b><span>No Google Drive, compartilhe a pasta "${esc(nomeRaiz())}" com o e-mail do colega, como Editor.</span></li>
        <li><b>Compartilhe o app no Claude</b><span>No menu Compartilhar deste app, convide o mesmo e-mail com acesso de Editor. Não ligue o link público: com ele, ninguém consegue salvar.</span></li>
        <li><b>Conta do colega</b><span>Ele precisa de uma conta no Claude com o Google Drive conectado (Configurações, Conectores).</span></li>
        <li><b>Teste com um lote</b><span>Peça para ele criar uma vistoria de teste e processar um lote com uma foto.</span></li>
      </ol>
      ${aviso('Em plano individual do Claude (Pro ou Max), a ajuda oficial diz que convidados não conseguem usar as partes do app que chamam o Claude e o Google Drive. Se o teste falhar nesse ponto, a saída é o plano Team, que coloca a equipe na mesma organização.')}
    </section>
    ${viewIdentidade()}
    <section class="card">
      <h3>Dados que aparecem no laudo</h3>
      ${dono ? '' : '<p class="hint">Só o dono do app muda estes dados.</p>'}
      <fieldset class="fs" ${dono ? '' : 'disabled'}>
      <div class="grid2">
        <div class="field"><label for="c-emp">Nome da imobiliária</label><input id="c-emp" data-cfg="empresa" value="${esc(c.empresa)}"></div>
        <div class="field"><label for="c-creci">CRECI</label><input id="c-creci" data-cfg="creci" value="${esc(c.creci)}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="c-cid">Cidade (vai na data do laudo)</label><input id="c-cid" data-cfg="cidade" value="${esc(c.cidade)}"></div>
        <div class="field"><label for="c-cont">Contato no rodapé (opcional)</label><input id="c-cont" data-cfg="contato" value="${esc(c.contato)}" placeholder="Telefone ou site"></div>
      </div>
      <div class="field"><label for="c-de">Declaração do laudo de entrada</label><textarea id="c-de" data-cfg="declaracaoEntrada" rows="5">${esc(c.declaracaoEntrada)}</textarea></div>
      <div class="field"><label for="c-ds">Declaração do laudo de saída</label><textarea id="c-ds" data-cfg="declaracaoSaida" rows="4">${esc(c.declaracaoSaida)}</textarea></div>
      </fieldset>
      <p class="hint">Vale a pena o advogado da imobiliária conferir estes dois textos. As mudanças são salvas sozinhas.</p>
    </section>
    ${S.permissions ? `<section class="card"><h3>Permissões</h3><p class="hint">Na primeira vez, o app pede licença para usar o Claude e o Google Drive. Aqui você revê o que liberou.</p><div><button class="btn" data-act="permissoes">Revisar permissões</button></div></section>` : ''}
    <p class="hint">Versão do app: ${VERSAO}. Novidades em github.com/lucasnevez/vistoria-de-imoveis.</p>
  </main>`;
}
function render() {
  let corpo;
  if (S.tela === 'vistoria' && S.v) corpo = viewVistoria();
  else if (S.tela === 'config') corpo = viewConfig();
  else if (S.tela === 'inicio') corpo = viewInicio();
  else corpo = viewHome();
  app.innerHTML = viewTopo() + corpo;
  if (S.tela === 'home') resolverNomes();
}
/* Os nomes de quem fez cada vistoria vêm da conta de cada pessoa, na hora de mostrar; no banco fica só o código da pessoa. */
async function resolverNomes() {
  if (!S.user || typeof S.user.profiles !== 'function') return;
  const ids = [...new Set(S.lista.map((v) => v.criadoPor).filter(Boolean))];
  if (!ids.length) return;
  let ps;
  try { ps = await S.user.profiles(ids); } catch (_) { return; }
  for (const id of ids) { const p = ps && ps[id]; S.nomes[id] = p ? (p.isMe ? 'você' : (p.name || 'outra pessoa')) : 'outra pessoa'; }
  document.querySelectorAll('[data-autor]').forEach((el) => { el.textContent = S.nomes[el.dataset.autor] || 'outra pessoa'; });
}

/* ---------- navegação ---------- */
async function irPara(tela) {
  if (S.busy) { toast('Espere terminar o que está em andamento.'); return; }
  if (S.tela === 'vistoria' && S.v && !S.v._novo) await flush();
  S.tela = tela; S.confirmar = null; S.msg = null;
  if (tela !== 'vistoria') { S.v = null; S.ultimo = null; setSave('idle'); }
  render();
  window.scrollTo(0, 0);
}
function abrir(id) {
  const doc = S.lista.find((x) => x.id === id);
  if (!doc) return;
  let v = clone(doc);
  let recuperado = false;
  try {
    const bruto = localStorage.getItem('ve-rascunho-' + id);
    if (bruto) {
      const r = JSON.parse(bruto);
      if (r && r.id === id && (r.atualizadoEm || 0) > (doc.atualizadoEm || 0)) { v = r; recuperado = true; }
      else localStorage.removeItem('ve-rascunho-' + id);
    }
  } catch (_) {}
  v.comodos = v.comodos || []; v.fotos = v.fotos || []; v.lotes = v.lotes || []; v.fotosSoltas = v.fotosSoltas || [];
  v.loteAtual = v.loteAtual || { n: v.lotes.length + 1, texto: '' }; v.drive = v.drive || {};
  v.comodos.forEach((c) => { c.itens = c.itens || []; c.itens.forEach((i) => { i.fotos = i.fotos || []; }); });
  S.v = v; S.tela = 'vistoria'; S.aba = v.fase === 'dados' ? 'lotes' : v.fase;
  S.ultimo = null; S.pedirProximo = false; S.msg = null; S.confirmar = null; S.laudoErro = ''; S.laudoAviso = '';
  setSave('saved');
  render();
  window.scrollTo(0, 0);
  if (recuperado) { markDirty(); toast('Recuperei alterações desta vistoria que não tinham sido salvas neste aparelho.'); }
}
function acharComodo(id) { return S.v && S.v.comodos.find((c) => c.id === id); }

/* ---------- eventos ---------- */
app.addEventListener('click', async (ev) => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, v = S.v;
  if (act !== 'excluir' && act !== 'rmitem' && act !== 'rmcomodo') S.confirmar = null;
  switch (act) {
    case 'home': return irPara('home');
    case 'config': return irPara('config');
    case 'onde': await irPara('config'); { const el = document.getElementById('onde'); if (el) el.scrollIntoView({ block: 'start' }); } return;
    case 'cfg-pasta': return prepararPastaRaiz();
    case 'cfg-trocar': return trocarPastaRaiz();
    case 'planilha': return baixarPlanilha();
    case 'filtro': S.filtro = b.dataset.val; return render();
    case 'nova': S.v = novaVistoria(); S.tela = 'vistoria'; S.aba = 'dados'; S.msg = null; setSave('idle'); render(); window.scrollTo(0, 0); { const f = document.getElementById('f-end'); if (f) f.focus(); } return;
    case 'abrir': return abrir(b.dataset.id);
    case 'tipo': if (v && v._novo) { v.tipo = b.dataset.val; if (v.tipo === 'entrada') v.entradaId = ''; render(); } return;
    case 'criar': return criar();
    case 'drive': return tentarDrive();
    case 'aba': if (v && !S.busy) { S.aba = b.dataset.val; S.msg = null; S.laudoErro = S.aba === 'laudo' ? S.laudoErro : ''; render(); window.scrollTo(0, 0); } return;
    case 'rmfoto': return removerFoto(b.dataset.asset);
    case 'processar': return processarLote();
    case 'parar': if (S.busy && S.busy.ctl) S.busy.ctl.abort(); return;
    case 'proximo': S.pedirProximo = false; S.ultimo = null; render(); { const el = document.getElementById('lote-topo') || document.querySelector('[data-pick]'); if (el) el.closest('.card').scrollIntoView({ block: 'start' }); } return;
    case 'consolidar': return consolidar();
    case 'complementar': if (v) { v.fase = 'lotes'; S.aba = 'lotes'; S.ultimo = null; S.pedirProximo = false; markDirty(); render(); window.scrollTo(0, 0); } return;
    case 'aprovar': return revisarLaudo();
    case 'gerar-direto': return finalizar();
    case 'rev-aplicar': return aplicarRevisao(true);
    case 'rev-sem': return aplicarRevisao(false);
    case 'rev-voltar': S.revisao = null; render(); window.scrollTo(0, 0); return;
    case 'verificar': return verificarConexoes();
    case 'reenviar-fotos': return reenviarFotos();
    case 'estilo': if (S.souDono) { S.cfg.estiloCapa = b.dataset.val; aplicarTema(); salvarCfg(true); render(); } return;
    case 'logo-versao': return trocarVersaoLogo();
    case 'concluir-inicio': return concluirInicio();
    case 'comecar': S.tela = 'home'; S.verif = null; render(); window.scrollTo(0, 0); return;
    case 'combo': return aplicarCombo(+b.dataset.i);
    case 'tirar-logo': return tirarLogo();
    case 'reabrir': if (v) { v.fase = 'revisao'; v.status = 'andamento'; S.aba = 'revisao'; S.laudoAviso = ''; markDirty(); render(); window.scrollTo(0, 0); } return;
    case 'baixar': return baixarPDF();
    case 'refazer': return refazer(b.dataset.val);
    case 'corrigir': return corrigir();
    case 'desfazer': return desfazerCorrecao();
    case 'addcomodo': if (v) { const c = { id: uid(), nome: 'Novo cômodo', itens: [], observacoes: '' }; v.comodos.push(c); markDirty(); render(); const el = document.querySelector(`#c-${CSS.escape(c.id)} input`); if (el) { el.focus(); el.select(); } } return;
    case 'additem': { const c = acharComodo(b.dataset.c); if (!c) return; const it = { id: uid(), nome: 'Novo item', estado: '', descricao: '', fotos: [], critico: false }; c.itens.push(it); markDirty(); render(); const el = document.querySelector(`[data-i="${CSS.escape(it.id)}"][data-f="nome"]`); if (el) { el.focus(); el.select(); } return; }
    case 'rmitem': {
      const k = 'i' + b.dataset.i;
      if (S.confirmar !== k) { S.confirmar = k; b.textContent = 'Confirmar exclusão'; return; }
      const c = acharComodo(b.dataset.c); if (!c) return;
      const it = c.itens.find((x) => x.id === b.dataset.i);
      c.itens = c.itens.filter((x) => x.id !== b.dataset.i);
      if (it) soltarFotos(it.fotos);
      S.confirmar = null; markDirty(); render(); return;
    }
    case 'rmcomodo': {
      const k = 'c' + b.dataset.c;
      if (S.confirmar !== k) { S.confirmar = k; b.textContent = 'Confirmar exclusão'; return; }
      const c = acharComodo(b.dataset.c); if (!c) return;
      v.comodos = v.comodos.filter((x) => x.id !== c.id);
      soltarFotos(c.itens.flatMap((i) => i.fotos));
      S.confirmar = null; markDirty(); render(); return;
    }
    case 'arquivar':
      if (v && !v._novo) { v.arquivada = !v.arquivada; markDirty(); await flush(); render(); toast(v.arquivada ? 'Vistoria arquivada. Ela fica na aba Arquivadas.' : 'Vistoria de volta à lista principal.'); }
      return;
    case 'excluir':
      if (!S.souDono) return;
      if (S.confirmar !== 'vist') { S.confirmar = 'vist'; b.textContent = 'Toque de novo para excluir de vez'; return; }
      return excluirVistoria();
    case 'permissoes': try { await S.permissions.manage(); } catch (_) { toast('Abra o menu Permissões do artefato no Claude para rever o que foi liberado.'); } return;
  }
});
document.getElementById('toast-root').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]');
  if (b && b.dataset.act === 'desfazer') { document.getElementById('toast-root').innerHTML = ''; desfazerCorrecao(); }
});
function soltarFotos(codes) {
  const v = S.v;
  const usados = new Set();
  v.comodos.forEach((c) => c.itens.forEach((i) => i.fotos.forEach((f) => usados.add(f))));
  v.fotosSoltas = v.fotosSoltas || [];
  for (const code of codes) if (!usados.has(code) && !v.fotosSoltas.includes(code)) v.fotosSoltas.push(code);
}
function setCaminho(obj, caminho, valor) {
  const ps = caminho.split('.');
  let o = obj;
  for (let i = 0; i < ps.length - 1; i++) o = o[ps[i]] = o[ps[i]] || {};
  o[ps[ps.length - 1]] = valor;
}
app.addEventListener('input', (ev) => {
  const t = ev.target;
  const v = S.v;
  if (t.dataset.bind && v) {
    setCaminho(v, t.dataset.bind, t.value);
    if (t.dataset.bind === 'loteAtual.texto' && S.msg && S.msg.onde === 'lote' && !S.msg.fixa) { S.msg = null; const el = document.getElementById('msg-lote'); if (el) el.innerHTML = ''; }
    markDirty();
    return;
  }
  if (t.dataset.cfg) { if (S.souDono) { S.cfg[t.dataset.cfg] = t.value; salvarCfg(); atualizarPrevia(); } return; }
  if (t.hasAttribute('data-novapasta')) { S.novaPasta = t.value; return; }
  if (t.dataset.cor) { if (S.souDono && hexOk(t.value)) { S.cfg[t.dataset.cor] = t.value; aplicarTema(); atualizarPrevia(); } return; }
  if (t.hasAttribute('data-corr')) { S.correcao = t.value; return; }
  if (t.dataset.cmp && v && v.comparacao && t.tagName === 'TEXTAREA') {
    const x = v.comparacao.itens.find((i) => i.id === t.dataset.cmp);
    if (x) { x[t.dataset.f] = t.value; markDirty(); }
    return;
  }
  if (t.dataset.c && v && t.type !== 'checkbox' && t.tagName !== 'SELECT') {
    const c = acharComodo(t.dataset.c); if (!c) return;
    if (t.dataset.i) { const it = c.itens.find((x) => x.id === t.dataset.i); if (it) it[t.dataset.f] = t.value; }
    else c[t.dataset.f] = t.value;
    markDirty();
  }
});
app.addEventListener('change', (ev) => {
  const t = ev.target;
  const v = S.v;
  if (t.hasAttribute('data-logo')) { const f = t.files && t.files[0]; t.value = ''; if (f) trocarLogo(f); return; }
  if (t.dataset.cor) { if (S.souDono) salvarCfg(true); return; }
  if (t.dataset.rev !== undefined && S.revisao) { S.revisao.marcadas[+t.dataset.rev] = t.checked; return; }
  if (t.hasAttribute('data-pick')) { const fs = t.files ? [...t.files] : []; t.value = ''; if (fs.length) aoEscolherFotos(fs); return; }
  if (t.dataset.sel === 'entradaId' && v) {
    v.entradaId = t.value;
    const e = entradaDe(v);
    if (e) {
      if (!v.endereco.trim()) v.endereco = e.endereco || '';
      if (!v.descricao.trim()) v.descricao = e.descricao || '';
      if (!v.locador.trim()) v.locador = e.locador || '';
      if (!v.locatario.trim()) v.locatario = e.locatario || '';
      if (!v.codigo.trim()) v.codigo = e.codigo || '';
    }
    markDirty(); render(); return;
  }
  if (t.dataset.cmp && v && v.comparacao && t.tagName === 'SELECT') {
    const x = v.comparacao.itens.find((i) => i.id === t.dataset.cmp);
    if (x) { x.situacao = t.value; markDirty(); const row = t.closest('.cmp-row'); if (row) row.className = 'cmp-row sit-' + t.value; }
    return;
  }
  if (t.dataset.c && v && (t.type === 'checkbox' || t.tagName === 'SELECT')) {
    const c = acharComodo(t.dataset.c); if (!c) return;
    const it = c.itens.find((x) => x.id === t.dataset.i); if (!it) return;
    if (t.type === 'checkbox') it.critico = t.checked; else it[t.dataset.f] = t.value;
    markDirty();
    const box = t.closest('.item'); if (box) box.className = 'item est-' + (it.estado || '');
  }
});
window.addEventListener('pagehide', () => { if (S.v && !S.v._novo) flush(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S.v && !S.v._novo) flush(); });

/* ---------- início ---------- */
aplicarTema();
render();
(async () => {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { S.semRuntime = true; S.pronto = true; render(); return; }
  const nomes = ['db', 'user', 'sample', 'assets', 'mcp', 'downloads', 'permissions'];
  const res = await Promise.all(nomes.map((n) => c.use(n).catch(() => null)));
  nomes.forEach((n, i) => { S[n] = res[i]; });
  if (S.user) {
    try { const w = await S.user.can('data.write'); S.podeEscrever = w === false ? false : w === true ? true : null; } catch (_) { S.podeEscrever = null; }
    try { S.meuNome = (await S.user.name()) || ''; } catch (_) {}
    try { S.meuId = (await S.user.id()) || null; } catch (_) {}
    try { S.souDono = !!(await S.user.isOwner()); } catch (_) {}
  } else S.podeEscrever = null;
  if (S.sample) { try { const l = await S.sample.limits(); S.imgMax = (l && l.images && l.images.maxCount) || 0; } catch (_) { S.imgMax = 0; } }
  if (S.mcp) { try { const t = await S.mcp.listTools(); S.fileArgs = !!(t && t.fileArgs); } catch (_) {} }
  if (S.db) {
    try { const d = await S.db.doc('config/geral').get(); if (d.exists) S.cfg = { ...CFG_PADRAO, ...d.data() }; } catch (_) {}
    aplicarTema();
    S.db.collection('vistorias').orderBy('atualizadoEm', 'desc').limit(300).onSnapshot((snap) => {
      S.lista = snap.docs.map((d) => d.data()).filter(Boolean);
      S.listaCarregada = true; S.listaErro = null;
      if (S.tela === 'home' && !S.busy) render();
    }, (e) => { S.listaErro = e; S.listaCarregada = true; if (S.tela === 'home') render(); });
  }
  S.pronto = true;
  if (precisaInicio()) { S.tela = 'inicio'; if (S.cfg.configurado !== true) S.cfg.configurado = false; }
  render();
})();
})();
</script>
